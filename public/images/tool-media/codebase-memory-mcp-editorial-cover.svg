    <text x="270" y="325">{} </text><text x="440" y="200">ƒ</text><text x="450" y="465">md</text>
    <text x="630" y="285">MCP</text><text x="790" y="165">cfg</text><text x="790" y="440">db</text><text x="960" y="270">AI</text>
