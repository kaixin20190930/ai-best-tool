<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Codebase Memory MCP editorial illustration</title>
  <desc id="desc">A local code graph connecting files, symbols, and an AI agent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102a43"/><stop offset="1" stop-color="#1f6f78"/></linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d7f4ec"/><stop offset="1" stop-color="#79c7b5"/></linearGradient>
  </defs>
  <rect width="1200" height="630" rx="40" fill="url(#bg)"/>
  <g fill="none" stroke="#a6ded1" stroke-opacity=".72" stroke-width="8">
