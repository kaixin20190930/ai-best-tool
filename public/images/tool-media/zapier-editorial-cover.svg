<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">A workflow and its usage boundaries</title>
  <desc id="desc">Original editorial diagram linking an event to actions and usage review. No vendor logo, product interface or screenshot is depicted.</desc>
  <rect width="1200" height="675" rx="32" fill="#182334"/>
  <text x="76" y="100" fill="#f2f5fa" font-family="sans-serif" font-size="38" font-weight="700">One workflow. Several cost boundaries.</text>
  <text x="76" y="148" fill="#b9c9df" font-family="sans-serif" font-size="22">Check the version, connected actions and account plan.</text>
  <path d="M290 330H445M705 330H860" stroke="#9ebae9" stroke-width="6" fill="none"/>
  <rect x="76" y="245" width="214" height="170" rx="20" fill="#30425e"/>
  <rect x="445" y="245" width="260" height="170" rx="20" fill="#30425e"/>
  <rect x="860" y="245" width="264" height="170" rx="20" fill="#30425e"/>
  <text x="141" y="342" fill="#f2f5fa" font-family="sans-serif" font-size="28">Event</text>
  <text x="523" y="342" fill="#f2f5fa" font-family="sans-serif" font-size="28">Actions</text>
  <text x="898" y="342" fill="#f2f5fa" font-family="sans-serif" font-size="28">Usage review</text>
  <text x="76" y="528" fill="#f2f5fa" font-family="sans-serif" font-size="26">Workflow tasks and agent activities are different units.</text>
  <text x="76" y="577" fill="#b9c9df" font-family="sans-serif" font-size="22">A directory listing is not a tested integration.</text>
  <text x="76" y="628" fill="#9fb2cd" font-family="sans-serif" font-size="16">AI Best Tool original editorial illustration · Not a product screenshot</text>
</svg>
