<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Governed agent tool access — editorial illustration</title>
  <desc id="desc">Original diagram of agent access through a grant and policy boundary to tools and an action receipt. Not a product screenshot or security certification.</desc>
  <rect width="1200" height="675" fill="#102c2a"/>
  <text x="80" y="100" fill="#b8ead5" font-family="sans-serif" font-size="24" letter-spacing="4">AI BEST TOOL · EDITORIAL</text>
  <text x="80" y="177" fill="#ffffff" font-family="sans-serif" font-size="48">Agent tools with explicit authority</text>
  <rect x="80" y="277" width="220" height="145" rx="20" fill="#28514a"/><text x="122" y="362" fill="#fff" font-family="sans-serif" font-size="32">AGENT</text>
  <path d="M327 350h69m-18-18 18 18-18 18" stroke="#7bd9b7" stroke-width="8" fill="none"/>
  <rect x="425" y="245" width="330" height="210" rx="20" fill="#397361"/><text x="466" y="331" fill="#fff" font-family="sans-serif" font-size="30">GRANT + POLICY</text><text x="468" y="389" fill="#d7f5e8" font-family="sans-serif" font-size="25">Approval boundary</text>
