  <text x="80" y="571" fill="#cee5db" font-family="sans-serif" font-size="23">Discovery is not authorization · synthetic demo ≠ live integration</text>
  <text x="80" y="621" fill="#98b9ab" font-family="sans-serif" font-size="20">Neutral editorial illustration — not a product screenshot</text>
