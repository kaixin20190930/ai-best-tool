    <rect x="18" y="18" width="406" height="274" rx="10" fill="url(#frame)"/>
    <circle cx="318" cy="90" r="32" fill="#f8dfae"/>
    <path d="M20 248 132 130l72 76 73-103 128 145v44H20Z" fill="#557e7a"/>
