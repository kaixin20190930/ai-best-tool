    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b7e7d5"/>
      <stop offset="1" stop-color="#e6b983"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <path d="M0 520 C230 445 380 600 610 516 S990 422 1200 490 V675 H0Z" fill="#132b3c" opacity=".75"/>
