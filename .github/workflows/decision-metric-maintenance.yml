name: Decision metric retention maintenance

on:
  schedule:
    - cron: '40 1 * * *'
  workflow_dispatch:

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://aibesttool.com' }}
      MONITOR_API_TOKEN: ${{ secrets.MONITOR_API_TOKEN }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
    steps:
      - name: Validate required token
        run: |
          if [ -z "${MONITOR_API_TOKEN}" ]; then
            echo "MONITOR_API_TOKEN is required."
            exit 1
          fi

      - name: Run retention maintenance
        run: |
          set -euo pipefail
          BASE_URL="${BASE_URL%/}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${MONITOR_API_TOKEN}" \
            "$BASE_URL/api/monitor/decision-metrics-maintenance" \
            --output /tmp/decision-metric-maintenance.json
          grep -q '"ok":true' /tmp/decision-metric-maintenance.json
          grep -q '"freshnessStatus":"fresh"' /tmp/decision-metric-maintenance.json

      - name: Notify Feishu on failure
        if: failure() && env.FEISHU_WEBHOOK_URL != ''
        run: |
          PAYLOAD=$(cat <<EOF
          {
            "msg_type": "text",
            "content": {
              "text": "AI Best Tool decision metric retention maintenance failed.\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
          }
          EOF
          )
          curl -sS -X POST "${FEISHU_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
